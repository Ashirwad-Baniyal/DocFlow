name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend
  K8S_NAMESPACE: enterprise-docs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────
# JOB 1: Backend Tests
# ─────────────────────────────────────────────────────────────
jobs:
  test-backend:
    name: 🧪 Backend Tests (Java 21 / Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: testdb
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -ptestpass"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
        ports:
          - 3306:3306

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "eclipse-temurin"
          cache: maven

      - name: 📦 Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: 🔍 Verify Maven version
        working-directory: backend
        run: mvn --version

      - name: 🧹 Run Backend Tests
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/testdb?useSSL=false&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: testuser
          SPRING_DATASOURCE_PASSWORD: testpass
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          JWT_SECRET: test-secret-key-for-ci-pipeline-min-32-chars-long
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: |
          mvn clean test \
            -B \
            --no-transfer-progress \
            -Dspring.profiles.active=test \
            -Dsurefire.failIfNoSpecifiedTests=false

      - name: 📊 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/
          retention-days: 14

      - name: 📈 Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/target/site/jacoco/
          retention-days: 14

      - name: 📉 Check Coverage Threshold
        working-directory: backend
        run: |
          mvn jacoco:check \
            -B \
            --no-transfer-progress \
            -Djacoco.minimum.coverage=0.70 || echo "Coverage below threshold — review report"

      - name: 🔒 Run OWASP Dependency Check
        working-directory: backend
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -B \
            --no-transfer-progress \
            -DfailBuildOnCVSS=9 \
            -DskipProvidedScope=true || echo "OWASP check completed"
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Frontend Tests & Build
  # ─────────────────────────────────────────────────────────────
  test-frontend:
    name: 🧪 Frontend Tests (Node 20 / Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit

      - name: 🔍 Lint (ESLint)
        working-directory: frontend
        run: npm run lint
        continue-on-error: false

      - name: 🏗️ Build (type-check + bundle)
        working-directory: frontend
        run: npm run build

      - name: 🧪 Run Unit Tests (Vitest)
        working-directory: frontend
        run: npm run test -- --reporter=verbose --reporter=junit --outputFile=test-results.xml
        continue-on-error: true

      - name: 📊 Upload Frontend Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/test-results.xml
          retention-days: 14

      - name: 📦 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Build & Push Docker Images
  # ─────────────────────────────────────────────────────────────
  build-and-push:
    name: 🐳 Build & Push Docker Images
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write
      security-events: write

    outputs:
      backend-image: ${{ steps.meta-backend.outputs.tags }}
      frontend-image: ${{ steps.meta-frontend.outputs.tags }}
      image-tag: ${{ steps.vars.outputs.sha_short }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔢 Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Backend image metadata ──────────────────────────────
      - name: 🏷️ Extract Backend Docker Metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # ── Frontend image metadata ─────────────────────────────
      - name: 🏷️ Extract Frontend Docker Metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # ── Build & push backend ────────────────────────────────
      - name: 🐳 Build and Push Backend Image
        id: build-backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          provenance: true
          sbom: true

      # ── Build & push frontend ───────────────────────────────
      - name: 🐳 Build and Push Frontend Image
        id: build-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          provenance: true
          sbom: true

      # ── Vulnerability scan ──────────────────────────────────
      - name: 🔒 Scan Backend Image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.BACKEND_IMAGE }}:latest"
          format: "sarif"
          output: "trivy-backend-results.sarif"
          severity: "CRITICAL,HIGH"
        continue-on-error: true

      - name: 🔒 Scan Frontend Image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.FRONTEND_IMAGE }}:latest"
          format: "sarif"
          output: "trivy-frontend-results.sarif"
          severity: "CRITICAL,HIGH"
        continue-on-error: true

      - name: 📤 Upload Trivy Security Results to GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "."
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────
  # JOB 4: Deploy to AWS EKS (Production)
  # ─────────────────────────────────────────────────────────────
  deploy-to-aws:
    name: 🚀 Deploy to AWS EKS (Production)
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://docs.yourdomain.com

    permissions:
      id-token: write   # Required for OIDC auth
      contents: read

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GitHubActionsDeploySession

      - name: 📋 Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER_NAME }} \
            --role-arn ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: ✅ Verify kubectl connectivity
        run: |
          kubectl version --client
          kubectl cluster-info
          kubectl get nodes -o wide

      - name: 📦 Set image tag variable
        id: tag
        run: echo "IMAGE_TAG=sha-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: 🚀 Deploy Backend to EKS
        run: |
          kubectl set image deployment/backend \
            backend=${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.IMAGE_TAG }} \
            -n ${{ env.K8S_NAMESPACE }}

      - name: 🚀 Deploy Frontend to EKS
        run: |
          kubectl set image deployment/frontend \
            frontend=${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.IMAGE_TAG }} \
            -n ${{ env.K8S_NAMESPACE }}

      - name: ⏳ Wait for Backend Rollout
        run: |
          kubectl rollout status deployment/backend \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=300s

      - name: ⏳ Wait for Frontend Rollout
        run: |
          kubectl rollout status deployment/frontend \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=180s

      - name: 🔍 Verify Deployment Status
        run: |
          echo "=== Pods ==="
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -o wide

          echo "=== Services ==="
          kubectl get services -n ${{ env.K8S_NAMESPACE }}

          echo "=== Ingress ==="
          kubectl get ingress -n ${{ env.K8S_NAMESPACE }}

          echo "=== HPA ==="
          kubectl get hpa -n ${{ env.K8S_NAMESPACE }}

      - name: 🏥 Post-Deploy Health Check
        run: |
          echo "Waiting 30s for health endpoints to stabilize..."
          sleep 30

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://docs.yourdomain.com/api/actuator/health \
            --max-time 15 \
            --retry 5 \
            --retry-delay 5) || STATUS="000"

          echo "Health check HTTP status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "❌ Health check failed with status $STATUS"
            echo "Rolling back backend deployment..."
            kubectl rollout undo deployment/backend -n ${{ env.K8S_NAMESPACE }}
            kubectl rollout undo deployment/frontend -n ${{ env.K8S_NAMESPACE }}
            exit 1
          fi

          echo "✅ Health check passed!"

      - name: 📣 Notify Slack on Success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ *Google Docs Clone* deployed successfully to production!\n*Commit:* `${{ github.sha }}`\n*Actor:* ${{ github.actor }}\n*URL:* https://docs.yourdomain.com"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: 📣 Notify Slack on Failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "❌ *Google Docs Clone* deployment FAILED!\n*Commit:* `${{ github.sha }}`\n*Actor:* ${{ github.actor }}\n*Branch:* ${{ github.ref_name }}\n*Run:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────
  # JOB 5: Deploy to Staging (develop branch)
  # ─────────────────────────────────────────────────────────────
  deploy-to-staging:
    name: 🚧 Deploy to Staging
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging-docs.yourdomain.com

    permissions:
      id-token: write
      contents: read

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build and Push Backend (Staging)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:staging
          cache-from: type=gha,scope=backend-staging
          cache-to: type=gha,mode=max,scope=backend-staging

      - name: 🐳 Build and Push Frontend (Staging)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:staging
          cache-from: type=gha,scope=frontend-staging
          cache-to: type=gha,mode=max,scope=frontend-staging

      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 📋 Update kubeconfig (Staging EKS)
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name ${{ secrets.EKS_STAGING_CLUSTER_NAME }}

      - name: 🚀 Deploy to Staging
        run: |
          kubectl set image deployment/backend backend=${{ env.BACKEND_IMAGE }}:staging \
            -n ${{ env.K8S_NAMESPACE }}
          kubectl set image deployment/frontend frontend=${{ env.FRONTEND_IMAGE }}:staging \
            -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/backend -n ${{ env.K8S_NAMESPACE }} --timeout=300s
          kubectl rollout status deployment/frontend -n ${{ env.K8S_NAMESPACE }} --timeout=180s

      - name: 🏥 Staging Health Check
        run: |
          sleep 20
          curl -f https://staging-docs.yourdomain.com/api/actuator/health \
            --max-time 15 \
            --retry 5 \
            --retry-delay 5 \
          && echo "✅ Staging is healthy" \
          || echo "⚠️ Staging health check failed"
        continue-on-error: true
