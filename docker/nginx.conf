# ============================================================
# Nginx Configuration — Google Docs Clone
# ============================================================
# Revision: 2024-07-15
# ============================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    # ──────────────────────────────────────
    # MIME types
    # ──────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ──────────────────────────────────────
    # Logging
    # ──────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    # ──────────────────────────────────────
    # Performance
    # ──────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens      off;

    # ──────────────────────────────────────
    # Client settings
    # ──────────────────────────────────────
    client_max_body_size        50m;
    client_body_buffer_size     128k;
    client_header_buffer_size   1k;
    large_client_header_buffers 4 8k;
    client_body_timeout         30s;
    client_header_timeout       30s;
    send_timeout                30s;

    # ──────────────────────────────────────
    # Proxy settings (global defaults)
    # ──────────────────────────────────────
    proxy_connect_timeout       60s;
    proxy_send_timeout          300s;
    proxy_read_timeout          300s;
    proxy_buffering             on;
    proxy_buffer_size           4k;
    proxy_buffers               8 4k;
    proxy_busy_buffers_size     8k;
    proxy_temp_file_write_size  64k;
    proxy_http_version          1.1;

    # ──────────────────────────────────────
    # Gzip compression
    # ──────────────────────────────────────
    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    6;
    gzip_buffers       16 8k;
    gzip_http_version  1.1;
    gzip_min_length    256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        text/x-component
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        application/vnd.ms-fontobject
        font/truetype
        font/opentype
        image/svg+xml;

    # ──────────────────────────────────────
    # Rate limiting zones
    # ──────────────────────────────────────
    limit_req_zone  $binary_remote_addr zone=api_limit:10m    rate=60r/m;
    limit_req_zone  $binary_remote_addr zone=auth_limit:10m   rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ──────────────────────────────────────
    # Upstreams
    # ──────────────────────────────────────
    upstream backend {
        server backend:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream frontend {
        server frontend:80 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # ──────────────────────────────────────
    # Map for WebSocket upgrade
    # ──────────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ══════════════════════════════════════════════════════════
    # Server block — port 80
    # ══════════════════════════════════════════════════════════
    server {
        listen       80;
        listen       [::]:80;
        server_name  _;

        # ── Security headers ──────────────────────────────────
        add_header X-Frame-Options            "SAMEORIGIN"                          always;
        add_header X-XSS-Protection           "1; mode=block"                       always;
        add_header X-Content-Type-Options     "nosniff"                             always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin"     always;
        add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy
            "default-src 'self'; \
             script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com; \
             style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
             font-src 'self' https://fonts.gstatic.com; \
             img-src 'self' data: https: blob:; \
             connect-src 'self' wss: ws: https://accounts.google.com; \
             frame-src https://accounts.google.com; \
             object-src 'none';" always;

        limit_conn conn_limit 50;

        # ── Health check (nginx level) ─────────────────────────
        location = /healthz {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ── REST API ──────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass         http://backend/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   X-Forwarded-Port  $server_port;
            proxy_set_header   Connection        "";

            proxy_connect_timeout  60s;
            proxy_send_timeout     300s;
            proxy_read_timeout     300s;

            # CORS preflight pass-through
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin  $http_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
                add_header Access-Control-Max-Age       1728000;
                add_header Content-Length 0;
                return 204;
            }
        }

        # ── Authentication endpoints (stricter rate-limit) ────
        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;

            proxy_pass         http://backend/api/auth/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # ── WebSocket (STOMP over SockJS) ─────────────────────
        location /ws/ {
            proxy_pass         http://backend/ws/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # WebSocket specific timeouts
            proxy_read_timeout     3600s;
            proxy_send_timeout     3600s;
            proxy_connect_timeout  60s;

            # Disable buffering for real-time connections
            proxy_buffering    off;
            proxy_cache        off;
        }

        # ── OAuth2 redirect endpoints ─────────────────────────
        location /oauth2/ {
            proxy_pass         http://backend/oauth2/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # ── Login / OAuth2 callback ───────────────────────────
        location /login/ {
            proxy_pass         http://backend/login/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # ── Actuator (internal monitoring; restrict in prod) ──
        location /actuator/ {
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
            deny all;

            proxy_pass         http://backend/actuator/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Connection        "";
        }

        # ── Swagger / OpenAPI ─────────────────────────────────
        location /swagger-ui/ {
            proxy_pass         http://backend/swagger-ui/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Connection        "";
        }

        location /v3/api-docs {
            proxy_pass         http://backend/v3/api-docs;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   Connection        "";
        }

        # ── SPA Frontend (catch-all) ──────────────────────────
        location / {
            proxy_pass         http://frontend/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            proxy_intercept_errors on;
            error_page 404 = @frontend_spa;
        }

        # SPA fallback — serve index.html for unknown routes
        location @frontend_spa {
            proxy_pass         http://frontend/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   Connection        "";
        }

        # ── Static asset caching ──────────────────────────────
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   Connection        "";

            expires            1y;
            add_header         Cache-Control     "public, immutable";
            add_header         Vary              "Accept-Encoding";
        }

        # ── Error pages ───────────────────────────────────────
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
