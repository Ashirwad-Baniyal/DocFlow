---
# ─── Local Dev Profile ────────────────────────────────────────────────────────
# Run with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
# No Docker, MySQL, Redis, or Kafka required.
spring:
  config:
    activate:
      on-profile: local

  # H2 in-memory database (replaces MySQL for local dev)
  datasource:
    url: jdbc:h2:mem:docdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=USER
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

  # Disable Kafka (no broker needed)
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false

  # Disable Redis and Kafka autoconfiguration (use simple in-memory mock)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  # Disable mail
  mail:
    host: localhost
    port: 25
    username: dev@localhost
    password: dev

  # Disable OAuth2 (comment out or use dummy values)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: local-dev-client-id
            client-secret: local-dev-secret

logging:
  level:
    root: INFO
    com.enterprise.docs: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

management:
  health:
    mail:
      enabled: false
  endpoint:
    health:
      show-details: always
