# ============================================================
# Nginx SPA Config — Frontend Container
# Serves React/Vite static files with SPA fallback
# ============================================================

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Performance ──────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;

    # ── Gzip ─────────────────────────────────────────────────
    gzip               on;
    gzip_vary          on;
    gzip_comp_level    6;
    gzip_min_length    256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Cache static assets aggressively ─────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map|webp|avif)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        add_header Vary          "Accept-Encoding";
        access_log off;
    }

    # ── Favicon ───────────────────────────────────────────────
    location = /favicon.ico {
        expires    1y;
        access_log off;
        log_not_found off;
    }

    # ── Robots.txt ────────────────────────────────────────────
    location = /robots.txt {
        access_log    off;
        log_not_found off;
    }

    # ── Health check ─────────────────────────────────────────
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── SPA catch-all ─────────────────────────────────────────
    # All unmatched paths serve index.html so React Router works
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # ── Error pages ───────────────────────────────────────────
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}
